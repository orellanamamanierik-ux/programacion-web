<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>La Granja de Masao - Pedí Rápido</title>
  </head>

  <body>
    <header>
      <h1>LA GRANJA DE MASAO</h1>
      <p>LA GRANJA</p>
    </header>

    <main>
      <form action="#" method="POST">
        <h2>SOLICITUD DE ANIMAL</h2>

        <section>
          <h3>Tus datos</h3>

          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />

          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" />
        </section>

        <section>
          <h3>Tamaño</h3>

          <div class="opcion">
            <input type="radio" id="chico" name="tamanio" value="chico" />
            <label for="chico">Pequeño</label>
          </div>

          <div class="opcion">
            <input type="radio" id="grande" name="tamanio" value="grande" />
            <label for="grande">Grande</label>
          </div>
        </section>

        <section>
          <h3>Tipo de animal</h3>

          <label for="animal">Elegí tu animal</label>

          <select id="animal" name="animal" required>
            <option value="">-- Elegí uno --</option>
            <option value="gallina">Gallina</option>
            <option value="caballo">Caballo</option>
            <option value="jirafa">Jirafa</option>
            <option value="chancho">Chancho</option>
          </select>
        </section>

        <section>
          <h3>Color del Animal</h3>

          <div class="opcion">
            <input
              type="checkbox"
              id="blanco"
              name="color_blanco"
              value="blanco"
            />
            <label for="blanco">Blanco</label>
          </div>

          <div class="opcion">
            <input
              type="checkbox"
              id="negro"
              name="color_negro"
              value="negro"
            />
            <label for="negro">Negro</label>
          </div>

          <div class="opcion">
            <input
              type="checkbox"
              id="marron"
              name="color_marron"
              value="marron"
            />
            <label for="marron">Marrón</label>
          </div>

          <div class="opcion">
            <input
              type="checkbox"
              id="amarillo"
              name="color_amarillo"
              value="amarillo"
            />
            <label for="amarillo">Amarillo / Manchado</label>
          </div>

          <div class="opcion">
            <input
              type="checkbox"
              id="gris"
              name="color_gris"
              value="gris"
            />
            <label for="gris">Gris</label>
          </div>
        </section>

        <section>
          <h3>Cantidad</h3>

          <label for="cantidad">¿Cuántos animales?</label>

          <input
            type="number"
            id="cantidad"
            name="cantidad"
            min="1"
            max="10"
            value="1"
            required
          />
        </section>

        <section>
          <h3>Comentarios</h3>

          <textarea id="comentarios" name="comentarios" rows="4"></textarea>
        </section>

        <button type="submit">Hacer pedido</button>
      </form>
    </main>
  </body>
</html>
